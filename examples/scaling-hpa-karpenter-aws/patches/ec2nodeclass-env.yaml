apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: -default
spec:
  role: my-cluster-karpenter-node
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: my-cluster
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: my-cluster
