apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Example (AWS-specific): opt in to spot capacity over the AWS NodePool wrapper.
# This example shows only the spot opt-in over the AWS wrapper. For
# namePrefix rewriting of nodeClassRef, see examples/scaling-hpa-karpenter-aws.

resources:
  - ../../components/karpenter-nodepool-aws

components:
  - ../../components/karpenter-nodepool-spot

patches:
  - path: patches/ec2nodeclass-env.yaml
    target:
      group: karpenter.k8s.aws
      version: v1
      kind: EC2NodeClass
      name: -default
