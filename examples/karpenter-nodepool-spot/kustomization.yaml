apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Example (GCP-specific): opt in to spot capacity over the GCP NodePool wrapper.
# For namePrefix rewriting of nodeClassRef, see examples/scaling-hpa-karpenter-gcp.

resources:
  - ../../components/karpenter-nodepool-gcp

components:
  - ../../components/karpenter-nodepool-spot

patches:
  - path: patches/gcenodeclass-env.yaml
    target:
      group: karpenter.k8s.gcp
      version: v1alpha1
      kind: GCENodeClass
      name: -default
