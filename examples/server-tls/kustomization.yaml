apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namePrefix: example
namespace: example

resources:
  - ../../workloads/deployment-http
  - ../../components/serviceaccount

components:
  - ../../components/server-tls

patches:
  - target:
      kind: Deployment
      name: -app
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: -app
      spec:
        template:
          spec:
            containers:
              - name: app
                volumeMounts:
                  - name: application-data
                    mountPath: /var/lib/application
            volumes:
              - name: application-data
                emptyDir: {}
              - name: server-tls
                secret:
                  secretName: example-server-tls
