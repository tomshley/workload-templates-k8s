apiVersion: apps/v1
kind: Deployment
metadata:
  name: -app
spec:
  template:
    spec:
      containers:
        - name: app
          volumeMounts:
            - name: server-tls
              mountPath: /etc/ssl/server
              readOnly: true
      volumes:
        - name: server-tls
          secret:
            secretName: server-tls
            optional: false
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
