# Provider-neutral CA bundle for TLS database connections. Put whatever CA
# your database presents in the PEM slot: PostgreSQL, YugabyteDB, an
# in-cluster operator's cluster CA (e.g. CloudNativePG), or a managed
# service's bundle (e.g. AWS RDS). The component carries no provider fields.
apiVersion: v1
kind: Secret
metadata:
  name: -db-ca-bundle
stringData:
  db-ca-bundle.pem: "PLACEHOLDER"
