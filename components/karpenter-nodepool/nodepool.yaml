# Provider-neutral Karpenter NodePool policy: capacity type, resource limits,
# and consolidation. `NodePool` is a core `karpenter.sh` kind, but Karpenter
# requires a provider NodeClass to provision machines, so the nodeClassRef
# below is a fail-closed placeholder (the API server rejects it) — exactly
# like the leading-hyphen resource names and PLACEHOLDER_IMAGE elsewhere in
# this library. Never consume this component directly: consume a provider
# wrapper (e.g. `karpenter-nodepool-aws`), which supplies its NodeClass,
# patches this reference, and appends provider-specific requirements.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: -default
spec:
  template:
    spec:
      nodeClassRef:
        group: PLACEHOLDER_NODECLASS_GROUP
        kind: PLACEHOLDER_NODECLASS_KIND
        name: -default
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
  limits:
    cpu: "8"
    memory: "32Gi"
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 60s
